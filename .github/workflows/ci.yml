name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-15
            python: '3.12'
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure writable caches
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/numba" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran
      - name: Install macOS compiler
        if: runner.os == 'macOS'
        run: brew install gcc
      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel 'numpy>=2,<3' meson ninja
      - name: Build Fortran extension
        run: |
          gfortran --version
          bash setup_fortran.sh
      - name: Install package and test dependencies
        run: |
          python -m pip install '.[dev,jax]'
          python -m pip check
          python -m pip freeze
      - name: Verify installed backends outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import jax
          import redback_csm.csm as csm
          assert hasattr(csm.lc_mod, 'set_diffusion_escape_mode')
          assert jax.config.x64_enabled
          assert jax.default_backend() == 'cpu'
          print('Installed Fortran extension:', csm.__file__)
          print('JAX:', jax.__version__, jax.devices())
          PY
      - name: Run test suite
        run: python -m pytest tests -q -ra --junitxml=test-results/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
